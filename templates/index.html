<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Links</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="page">
    <nav class="nav">
      <a href="/about">About</a>
    </nav>
    <h1>My Links</h1>
    <form class="form" action="/add" method="post">
      <div class="field">
        <label for="site_name">Site Name</label>
        <input id="site_name" name="site_name" type="text" />
      </div>
      <div class="field">
        <label for="url">URL</label>
        <input id="url" name="url" type="url" />
      </div>
      <button type="submit">add link</button>
    </form>
    <ul class="links">
      {% for link in links %}
      <li>
        <div class="link-card">
          <a class="link-card-anchor" href="{{ link.url }}">{{ link.name }}</a>
          <div class="link-actions">
            <a class="edit-button" href="{{ url_for('edit_link', link_index=loop.index0) }}">edit</a>
            <form action="/delete" method="post">
              <input name="link_index" type="hidden" value="{{ loop.index0 }}" />
              <button class="delete-button" type="submit">delete</button>
            </form>
          </div>
        </div>
      </li>
      {% endfor %}
    </ul>
    </main>
  </body>
</html>
