<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Link</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="page">
      <nav class="nav">
        <a href="/">Home</a>
      </nav>
      <h1>Edit Link</h1>
      <form class="form" action="{{ url_for('update_link', link_index=link_index) }}" method="post">
        <div class="field">
          <label for="site_name">Site Name</label>
          <input id="site_name" name="site_name" type="text" value="{{ link.name }}" />
        </div>
        <div class="field">
          <label for="url">URL</label>
          <input id="url" name="url" type="url" value="{{ link.url }}" />
        </div>
        <button type="submit">save changes</button>
      </form>
    </main>
  </body>
</html>
